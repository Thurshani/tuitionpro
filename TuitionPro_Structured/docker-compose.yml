services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: TuitionLocal123!
      MYSQL_DATABASE: tuitionpro
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tuitionpro_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  tuitionpro_mysql:
